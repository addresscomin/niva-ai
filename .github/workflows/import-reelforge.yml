name: temporary-ci-extract
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-reelforge.yml
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Print original CI workflow from source archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 817248a708857562421102480a5fed34582ea00d
          git show 817248a708857562421102480a5fed34582ea00d:reelforge-v2.2.zip > /tmp/reelforge-v2.2.zip
          unzip -p /tmp/reelforge-v2.2.zip reelforge/.github/workflows/ci.yml > /tmp/ci.yml
          echo "-----CI_WORKFLOW_BEGIN-----"
          cat /tmp/ci.yml
          echo "-----CI_WORKFLOW_END-----"
